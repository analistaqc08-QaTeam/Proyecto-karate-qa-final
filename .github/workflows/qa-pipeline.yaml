name: Proyecto Final Pipeline

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag del Proyecto'
        required: true
        default: '@automation-api'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn test -Dkarate.options="--tags ${{ github.event.inputs.tags }}"

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports